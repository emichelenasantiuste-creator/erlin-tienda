<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErLin - Tienda en Línea</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .cart-drawer { transition: transform 0.3s ease-in-out; }
    .cart-closed { transform: translateX(100%); }
    .cart-open { transform: translateX(0); }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-emerald-700 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <h1 class="text-2xl font-bold tracking-wide flex items-center gap-2">
        <i class="fa-solid fa-store"></i> ErLin
      </h1>
      
      <div class="flex items-center gap-3">
        <button id="btn-open-modal" class="bg-emerald-800 hover:bg-emerald-900 text-white text-xs md:text-sm px-3 py-2 rounded-lg flex items-center gap-1 transition">
          <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Nuevo</span> Producto
        </button>
        <button id="btn-toggle-cart" class="relative bg-emerald-600 hover:bg-emerald-500 p-2.5 rounded-full transition">
          <i class="fa-solid fa-cart-shopping text-lg"></i>
          <span id="cart-count" class="absolute -top-1 -right-1 bg-amber-500 text-slate-900 font-bold text-xs w-5 h-5 rounded-full flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
    
    <!-- Search & Categories -->
    <div class="mb-6 space-y-4">
      <div class="relative">
        <input type="text" id="search" placeholder="Buscar productos..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white shadow-sm">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400"></i>
      </div>

      <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none" id="categories-container"></div>
    </div>

    <!-- Products Grid -->
    <div id="products-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-12">
      <i class="fa-solid fa-box-open text-5xl text-slate-300 mb-3"></i>
      <p class="text-slate-500 font-medium">No se encontraron productos.</p>
    </div>
  </main>

  <!-- Cart Drawer -->
  <div id="cart-overlay" class="fixed inset-0 bg-black/50 z-40 hidden backdrop-blur-sm"></div>
  <aside id="cart-drawer" class="cart-drawer cart-closed fixed top-0 right-0 h-full w-full max-w-md bg-white z-50 shadow-2xl flex flex-col">
    <div class="p-4 bg-emerald-700 text-white flex items-center justify-between">
      <h2 class="text-lg font-bold flex items-center gap-2">
        <i class="fa-solid fa-cart-shopping"></i> Tu Carrito
      </h2>
      <button id="btn-close-cart" class="text-white hover:text-slate-200 text-xl p-1">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div id="cart-items" class="flex-grow overflow-y-auto p-4 space-y-3 divide-y divide-slate-100"></div>

    <div class="p-4 bg-slate-50 border-t border-slate-200 space-y-3">
      <div class="flex justify-between items-center text-lg font-bold text-slate-800">
        <span>Total:</span>
        <span id="cart-total" class="text-emerald-700">$0.00</span>
      </div>

      <!-- Checkout Form -->
      <form id="checkout-form" class="space-y-2.5 pt-2">
        <input type="text" id="cust-name" required placeholder="Tu Nombre Completo" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 outline-none">
        <input type="tel" id="cust-phone" required placeholder="Teléfono de Contacto" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 outline-none">
        <textarea id="cust-address" required placeholder="Dirección de entrega" rows="2" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
        
        <select id="cust-pay" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
          <option value="Efectivo">Pago en Efectivo</option>
          <option value="Transferencia">Transferencia Bancaria</option>
        </select>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg flex items-center justify-center gap-2 transition">
          <i class="fa-brands fa-whatsapp text-xl"></i> Confirmar y Pedir por WhatsApp
        </button>
      </form>
    </div>
  </aside>

  <!-- Add Product Modal -->
  <div id="product-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800">Agregar Producto</h3>
        <button id="btn-close-modal" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="add-product-form" class="space-y-3">
        <input type="text" id="prod-name" required placeholder="Nombre del Producto" class="w-full px-3 py-2 text-sm rounded-lg border outline-none focus:ring-2 focus:ring-emerald-500">
        <input type="number" step="0.01" id="prod-price" required placeholder="Precio ($)" class="w-full px-3 py-2 text-sm rounded-lg border outline-none focus:ring-2 focus:ring-emerald-500">
        
        <select id="prod-cat" class="w-full px-3 py-2 text-sm rounded-lg border outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
          <option value="Aseo">Aseo</option>
          <option value="Comida">Comida</option>
          <option value="Electrodomésticos">Electrodomésticos</option>
          <option value="Útiles para el hogar">Útiles para el hogar</option>
        </select>

        <input type="url" id="prod-img" placeholder="URL de la Imagen (Opcional)" class="w-full px-3 py-2 text-sm rounded-lg border outline-none focus:ring-2 focus:ring-emerald-500">

        <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-lg hover:bg-emerald-700 transition">
          Guardar Producto
        </button>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const PHONE = "5353826587";
      const categories = ["Todos", "Aseo", "Comida", "Electrodomésticos", "Útiles para el hogar"];
      let currentCategory = "Todos";
      
      let products = JSON.parse(localStorage.getItem("erlin_products")) || [];

      let cart = JSON.parse(localStorage.getItem("erlin_cart")) || [];

      function renderCategories() {
        const container = document.getElementById("categories-container");
        container.innerHTML = categories.map(cat => `
          <button data-cat="${cat}" class="btn-cat px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition ${currentCategory === cat ? 'bg-emerald-700 text-white' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}">
            ${cat}
          </button>
        `).join("");

        document.querySelectorAll(".btn-cat").forEach(btn => {
          btn.addEventListener("click", function() {
            currentCategory = this.getAttribute("data-cat");
            renderCategories();
            filterProducts();
          });
        });
      }

      function renderProducts(items = products) {
        const grid = document.getElementById("products-grid");
        const empty = document.getElementById("empty-state");
        
        const filtered = items.filter(p => currentCategory === "Todos" || p.category === currentCategory);

        if (filtered.length === 0) {
          grid.innerHTML = "";
          empty.classList.remove("hidden");
          return;
        }

        empty.classList.add("hidden");
        grid.innerHTML = filtered.map(p => `
          <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
            <img src="${p.image || 'https://via.placeholder.com/300?text=Sin+Imagen'}" alt="${p.name}" class="h-36 w-full object-cover">
            <div class="p-3 flex-grow flex flex-col justify-between space-y-2">
              <div>
                <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-medium">${p.category}</span>
                <h3 class="font-bold text-slate-800 text-sm mt-1 line-clamp-1">${p.name}</h3>
              </div>
              <div class="flex items-center justify-between pt-2 border-t border-slate-50">
                <span class="text-emerald-700 font-extrabold">$${p.price.toFixed(2)}</span>
                <button data-id="${p.id}" class="btn-add-cart bg-emerald-600 hover:bg-emerald-700 text-white p-2 rounded-lg text-xs transition">
                  <i class="fa-solid fa-cart-plus"></i>
                </button>
              </div>
            </div>
          </div>
        `).join("");

        document.querySelectorAll(".btn-add-cart").forEach(btn => {
          btn.addEventListener("click", function() {
            const id = parseInt(this.getAttribute("data-id"));
            addToCart(id);
          });
        });
      }

      function filterProducts() {
        const query = document.getElementById("search").value.toLowerCase();
        const filtered = products.filter(p => 
          p.name.toLowerCase().includes(query) && 
          (currentCategory === "Todos" || p.category === currentCategory)
        );
        renderProducts(filtered);
      }

      function addToCart(id) {
        const prod = products.find(p => p.id === id);
        const item = cart.find(c => c.id === id);
        if (item) {
          item.qty++;
        } else {
          cart.push({ ...prod, qty: 1 });
        }
        saveCart();
        updateCart();
        toggleCart(true);
      }

      function updateCart() {
        const container = document.getElementById("cart-items");
        const count = document.getElementById("cart-count");
        const totalEl = document.getElementById("cart-total");

        const totalItems = cart.reduce((acc, item) => acc + item.qty, 0);
        const totalPrice = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);

        count.textContent = totalItems;
        totalEl.textContent = `$${totalPrice.toFixed(2)}`;

        if (cart.length === 0) {
          container.innerHTML = '<p class="text-center text-slate-400 py-8 text-sm">Tu carrito está vacío.</p>';
          return;
        }

        container.innerHTML = cart.map(item => `
          <div class="flex items-center justify-between py-2">
            <div class="flex-grow pr-2">
              <h4 class="font-bold text-slate-800 text-sm">${item.name}</h4>
              <span class="text-xs text-slate-500">$${item.price.toFixed(2)} c/u</span>
            </div>
            <div class="flex items-center gap-2">
              <button data-id="${item.id}" data-change="-1" class="btn-qty w-6 h-6 bg-slate-200 rounded flex items-center justify-center font-bold text-slate-600">-</button>
              <span class="text-sm font-bold w-4 text-center">${item.qty}</span>
              <button data-id="${item.id}" data-change="1" class="btn-qty w-6 h-6 bg-slate-200 rounded flex items-center justify-center font-bold text-slate-600">+</button>
              <button data-id="${item.id}" class="btn-remove text-red-500 text-xs ml-2"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `).join("");

        document.querySelectorAll(".btn-qty").forEach(btn => {
          btn.addEventListener("click", function() {
            const id = parseInt(this.getAttribute("data-id"));
            const delta = parseInt(this.getAttribute("data-change"));
            changeQty(id, delta);
          });
        });

        document.querySelectorAll(".btn-remove").forEach(btn => {
          btn.addEventListener("click", function() {
            const id = parseInt(this.getAttribute("data-id"));
            removeItem(id);
          });
        });
      }

      function changeQty(id, delta) {
        const item = cart.find(c => c.id === id);
        if (item) {
          item.qty += delta;
          if (item.qty <= 0) cart = cart.filter(c => c.id !== id);
          saveCart();
          updateCart();
        }
      }

      function removeItem(id) {
        cart = cart.filter(c => c.id !== id);
        saveCart();
        updateCart();
      }

      function saveCart() {
        localStorage.setItem("erlin_cart", JSON.stringify(cart));
      }

      function toggleCart(forceOpen = false) {
        const drawer = document.getElementById("cart-drawer");
        const overlay = document.getElementById("cart-overlay");
        
        if (forceOpen || drawer.classList.contains("cart-closed")) {
          drawer.classList.remove("cart-closed");
          drawer.classList.add("cart-open");
          overlay.classList.remove("hidden");
        } else {
          drawer.classList.add("cart-closed");
          drawer.classList.remove("cart-open");
          overlay.classList.add("hidden");
        }
      }

      // Event Listeners
      document.getElementById("btn-toggle-cart").addEventListener("click", () => toggleCart());
      document.getElementById("btn-close-cart").addEventListener("click", () => toggleCart());
      document.getElementById("cart-overlay").addEventListener("click", () => toggleCart());
      
      document.getElementById("btn-open-modal").addEventListener("click", () => {
        document.getElementById("product-modal").classList.remove("hidden");
      });

      document.getElementById("btn-close-modal").addEventListener("click", () => {
        document.getElementById("product-modal").classList.add("hidden");
      });

      document.getElementById("search").addEventListener("input", filterProducts);

      document.getElementById("add-product-form").addEventListener("submit", function(e) {
        e.preventDefault();
        const newProd = {
          id: Date.now(),
          name: document.getElementById("prod-name").value,
          price: parseFloat(document.getElementById("prod-price").value),
          category: document.getElementById("prod-cat").value,
          image: document.getElementById("prod-img").value || "https://via.placeholder.com/300?text=Sin+Imagen"
        };
        products.push(newProd);
        localStorage.setItem("erlin_products", JSON.stringify(products));
        renderProducts();
        document.getElementById("product-modal").classList.add("hidden");
        this.reset();
      });

      document.getElementById("checkout-form").addEventListener("submit", function(e) {
        e.preventDefault();
        if (cart.length === 0) return alert("Tu carrito está vacío.");

        const name = document.getElementById("cust-name").value;
        const phone = document.getElementById("cust-phone").value;
        const address = document.getElementById("cust-address").value;
        const pay = document.getElementById("cust-pay").value;

        let msg = `🛒 *NUEVO PEDIDO - ErLin*\n\n`;
        msg += `👤 *Cliente:* ${name}\n`;
        msg += `📞 *Teléfono:* ${phone}\n`;
        msg += `📍 *Dirección:* ${address}\n`;
        msg += `💳 *Pago:* ${pay}\n\n`;
        msg += `📝 *Productos:*\n`;

        cart.forEach(item => {
          msg += `• ${item.qty}x ${item.name} - $${(item.price * item.qty).toFixed(2)}\n`;
        });

        const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
        msg += `\n💰 *Total:* $${total.toFixed(2)}`;

        const url = `https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`;
        window.open(url, "_blank");
      });

      // Init
      renderCategories();
      renderProducts();
      updateCart();
    });
  </script>
</body>
</html>
